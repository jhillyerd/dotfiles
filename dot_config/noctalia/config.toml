# Noctalia desktop shell configuration.
# Docs: https://docs.noctalia.dev/noctalia/configuration/
# This file layers on top of the default config Noctalia seeds into
# ~/.config/noctalia/ on first run.

[bar.default]
position = "bottom"
# Move the now-playing widget from the busy right lane to the left lane.
start = ["launcher", "wallpaper", "workspaces", "spacer", "media"]
# Keep the default right lane, except for the media widget now placed at start,
# plus CPU usage and free space on / after the tray.
end = [
  "tray",
  "notifications",
  "clipboard",
  "spacer",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "control-center",
  "session",
]
# Local clock followed by the UTC clock, side by side.
center = [
  "clock",
  "clock-utc",
  "spacer",
  "cpu",
  "disk-free",
]

# Add a small click-through gap before the now-playing widget.
[widget.spacer]
type = "spacer"
length = 30

# CPU usage percentage.
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

# Remaining disk space on the root filesystem.
# Docs: https://docs.noctalia.dev/noctalia/bar/widgets/sysmon/
[widget.disk-free]
type = "sysmon"
stat = "disk_free"
path = "/"

# The built-in disk_free thresholds ramp toward highlight_color as the *free*
# percentage rises, so a large amount of free space (ours is ~80%) reads as a
# critical value and turns the widget red. Disabling the critical threshold
# disables highlighting for that stat entirely.
# Docs: https://docs.noctalia.dev/noctalia/services/system-monitor/#value-highlighting
[system.monitor]
disk_free_activity_threshold = 80
disk_free_critical_threshold = 0

# Show the date alongside the time in the clock widget.
# Docs: https://docs.noctalia.dev/noctalia/bar/widgets/clock/
[widget.clock]
format = "{:%a %d %b} - {:%-I:%M %p %Z} -"

# Second clock instance showing UTC time only.
[widget.clock-utc]
type = "clock"
format = "{:%H:%M} UTC"
timezone = "UTC"

# Idle behavior, replacing swayidle:
#   lock        was: swayidle timeout 600 'lock-screen-sway.sh'
#   screen-off  was: swayidle timeout 900 'swaymsg "output * power off"'
[idle.behavior.lock]
timeout = 600
action = "lock"
enabled = true

[idle.behavior.screen-off]
timeout = 900
action = "screen_off"
enabled = true

[hooks]
# Lock 1Password whenever the session locks; was part of lock-screen-sway.sh.
session_locked = "1password --lock"

# Launch 1Password via after-noctalia-start.sh, backgrounded so startup
# isn't blocked. The script waits for the tray host before launching;
# see it for the full rationale. Previously started by after-sway-start.sh.
started = '~/.scripts/after-noctalia-start.sh >/dev/null 2>&1 &'
